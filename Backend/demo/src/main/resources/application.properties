spring.application.name=jobtrack
server.port=${PORT:8080}

# ---------- MySQL ----------
# 
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobtrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# ---------- JWT ----------

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

server.error.include-message=always
logging.level.org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration=ERROR
